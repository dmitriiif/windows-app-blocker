[package]
name = "windows-app-blocker"
version = "3.0.0"
edition = "2021"
description = "Closes the Windows apps you choose during the hours you choose."
license = "MIT"
publish = false

[lib]
name = "app_blocker"
path = "src/lib.rs"

[[bin]]
name = "windows-app-blocker"
path = "src/main.rs"
# The binary carries the administrator manifest; all tests live in the library.
test = false

# Cargo.lock pins chrono, parking_lot and libloading to releases that link through
# windows-targets rather than windows-link, so the GNU toolchain builds without extra tools.
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
